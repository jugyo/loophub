name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The declared floor in package.json `engines`. node:sqlite is
          # experimental here, so every script that touches the DB passes
          # NODE_OPTIONS='--experimental-sqlite ...' itself.
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # postinstall installs web/ dependencies too.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
