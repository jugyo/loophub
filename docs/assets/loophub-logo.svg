  <text x="58" y="32" fill="#1e293b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.5">LoopHub</text>
