<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    LoopHub mark: a circular loop-arrow (the dev loop that keeps iterating) around a
    central hub node (the supervised center). Geometric system, all concentric at (16,16):
    annular band r9-r13; wedge back edge radial (x=16, spanning r7.5-r14.5); tip extended
    along the wedge's lower edge; tail cut parallel to that lower edge. Standalone file
    used as the browser favicon, so the ink follows the OS light/dark preference via
    prefers-color-scheme; the indigo hub node is fixed.
  -->
  <style>
    .lh-ink { fill: #1e293b; }
    @media (prefers-color-scheme: dark) {
      .lh-ink { fill: #e2e8f0; }
    }
  </style>
  <path class="lh-ink" d="M27.43 9.8 A13 13 0 1 1 16 3 L16 1.5 L22.63 6.05 L16 8.5 L16 7 A9 9 0 1 0 23.62 11.21 Z"/>
  <circle cx="16" cy="16" r="4.5" fill="#6366F1"/>
</svg>
